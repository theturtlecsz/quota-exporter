[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-quota-exporter"
version = "0.1.0"
description = "Prometheus exporter for LLM subscription usage and quota windows (Anthropic, OpenAI/Codex, Gemini, Grok, Kimi)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "George Whewell", email = "georgerw@gmail.com" }]
keywords = ["prometheus", "exporter", "llm", "quota", "claude", "codex", "gemini", "grok", "kimi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "prometheus-client>=0.19",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/georgewhewell/quota-exporter"
Issues = "https://github.com/georgewhewell/quota-exporter/issues"

[project.scripts]
llm-quota-exporter = "llm_quota_exporter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_quota_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "RUF"]
