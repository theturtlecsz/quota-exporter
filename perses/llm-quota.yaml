              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
            sparkline:
              width: 2
            legendMode: 'off'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="openai",scope="all",window="seven_day"}
                seriesNameFormat: left
    ospark:
      kind: Panel
      spec:
        display:
          name: "openai \xB7 codex-spark"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
            sparkline:
              width: 2
            legendMode: 'off'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="openai",scope="gpt_5_3_codex_spark",window="seven_day"}
