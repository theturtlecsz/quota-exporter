kind: Dashboard
metadata:
  name: llm-quota-native
  project: llm
spec:
  display:
    name: LLM Quotas
  duration: 24h
  panels:
    h5:
      kind: Panel
      spec:
        display:
          name: "5-hour windows \u2014 remaining"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values:
              - last
            yAxis:
              format:
                unit: percent-decimal
                decimalPlaces: 0
              min: 0
              max: 1
            visual:
              display: line
              lineWidth: 2.5
              areaOpacity: 0.15
            tooltip:
              enablePinning: true
            querySettings:
            - queryIndex: 0
              colorMode: fixed
              colorValue: '#00ff41'
            - queryIndex: 1
              colorMode: fixed
              colorValue: '#ff2ec4'
            - queryIndex: 2
              colorMode: fixed
              colorValue: '#ffb000'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="anthropic",scope="all",window="five_hour"}
                seriesNameFormat: anthropic
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="kimi",scope="all",window="five_hour"}
                seriesNameFormat: kimi
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="openai",scope="all",window="five_hour"}
                seriesNameFormat: openai
    d7:
      kind: Panel
      spec:
        display:
          name: "7-day windows \u2014 remaining"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values:
              - last
            yAxis:
              format:
                unit: percent-decimal
                decimalPlaces: 0
              min: 0
              max: 1
            visual:
              display: line
              lineWidth: 2.5
              areaOpacity: 0.15
            tooltip:
              enablePinning: true
            querySettings:
            - queryIndex: 0
              colorMode: fixed
              colorValue: '#00ff41'
            - queryIndex: 1
              colorMode: fixed
              colorValue: '#00c433'
              lineStyle: dashed
            - queryIndex: 2
              colorMode: fixed
              colorValue: '#ffb000'
            - queryIndex: 3
              colorMode: fixed
              colorValue: '#ffd24d'
              lineStyle: dashed
            - queryIndex: 4
              colorMode: fixed
              colorValue: '#ff2ec4'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="anthropic",scope="all",window="seven_day"}
                seriesNameFormat: anthropic
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="anthropic",scope="fable",window="seven_day"}
                seriesNameFormat: "anthropic \xB7 fable cap"
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="openai",scope="all",window="seven_day"}
                seriesNameFormat: openai
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="openai",scope="gpt_5_3_codex_spark",window="seven_day"}
                seriesNameFormat: "openai \xB7 codex-spark"
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="kimi",scope="all",window="seven_day"}
                seriesNameFormat: kimi
    daily:
      kind: Panel
      spec:
        display:
          name: "daily windows \u2014 remaining (gemini)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values:
              - last
            yAxis:
              format:
                unit: percent-decimal
                decimalPlaces: 0
              min: 0
              max: 1
            visual:
              display: line
              lineWidth: 2.5
              areaOpacity: 0.15
            tooltip:
              enablePinning: true
            querySettings:
            - queryIndex: 0
              colorMode: fixed
              colorValue: '#00e5ff'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="gemini",window="bucket"}
                seriesNameFormat: '{{scope}}'
  layouts:
  - kind: Grid
    spec:
      items:
      - x: 0
        y: 0
        width: 24
        height: 8
        content:
          $ref: '#/spec/panels/h5'
      - x: 0
        y: 8
        width: 24
        height: 8
        content:
          $ref: '#/spec/panels/d7'
      - x: 0
        y: 16
        width: 24
        height: 6
        content:
          $ref: '#/spec/panels/daily'
