            sparkline:
              width: 2
            legendMode: 'off'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: min(1 - llm_quota_utilization_ratio{provider="gemini",window="bucket"})
                seriesNameFormat: left
  layouts:
  - kind: Grid
    spec:
      items:
      - x: 0
        y: 0
        width: 6
        height: 5
        content:
          $ref: '#/spec/panels/a5'
      - x: 6
        y: 0
        width: 6
        height: 5
        content:
          $ref: '#/spec/panels/a7'
      - x: 12
        y: 0
        width: 6
        height: 5
        content:
          $ref: '#/spec/panels/afable'
      - x: 18
        y: 0
        width: 6
        height: 5
        content:
          $ref: '#/spec/panels/o7'
      - x: 0
        y: 5
        width: 6
        height: 5
        content:
          $ref: '#/spec/panels/ospark'
      - x: 6
        y: 5
        width: 6
        height: 5
        content:
          $ref: '#/spec/panels/k5'
      - x: 12
