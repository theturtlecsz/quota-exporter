kind: Dashboard
metadata:
  name: llm-quota-native
  project: llm
spec:
  display:
    name: LLM Quotas
  duration: 24h
  panels:
    a5:
      kind: Panel
      spec:
        display:
          name: "anthropic \xB7 5-hour \u2014 left"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            max: 1
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="anthropic",scope="all",window="five_hour"}
                seriesNameFormat: left
    a7:
      kind: Panel
      spec:
        display:
          name: "anthropic \xB7 7-day \u2014 left"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            max: 1
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="anthropic",scope="all",window="seven_day"}
                seriesNameFormat: left
    afable:
      kind: Panel
      spec:
        display:
          name: "anthropic \xB7 fable weekly cap \u2014 left"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            max: 1
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="anthropic",scope="fable",window="seven_day"}
                seriesNameFormat: left
    o7:
      kind: Panel
      spec:
        display:
          name: "openai \xB7 7-day \u2014 left"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            max: 1
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="openai",scope="all",window="seven_day"}
                seriesNameFormat: left
    ospark:
      kind: Panel
      spec:
        display:
          name: "openai \xB7 codex-spark weekly \u2014 left"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            max: 1
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="openai",scope="gpt_5_3_codex_spark",window="seven_day"}
                seriesNameFormat: left
    k5:
      kind: Panel
      spec:
        display:
          name: "kimi \xB7 5-hour \u2014 left"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            max: 1
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="kimi",scope="all",window="five_hour"}
                seriesNameFormat: left
    k7:
      kind: Panel
      spec:
        display:
          name: "kimi \xB7 7-day \u2014 left"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            max: 1
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="kimi",scope="all",window="seven_day"}
                seriesNameFormat: left
    gdaily:
      kind: Panel
      spec:
        display:
          name: "gemini \xB7 daily \u2014 left (tightest model)"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            max: 1
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: min(1 - llm_quota_utilization_ratio{provider="gemini",window="bucket"})
                seriesNameFormat: left
  layouts:
  - kind: Grid
    spec:
      display:
        title: anthropic
        collapse:
          open: true
      items:
      - x: 0
        y: 0
        width: 8
        height: 6
        content:
          $ref: '#/spec/panels/a5'
      - x: 8
        y: 0
        width: 8
        height: 6
        content:
          $ref: '#/spec/panels/a7'
      - x: 16
        y: 0
        width: 8
        height: 6
        content:
          $ref: '#/spec/panels/afable'
  - kind: Grid
    spec:
      display:
        title: openai
        collapse:
          open: true
      items:
      - x: 0
        y: 0
        width: 8
        height: 6
        content:
          $ref: '#/spec/panels/o7'
      - x: 8
        y: 0
        width: 8
        height: 6
        content:
          $ref: '#/spec/panels/ospark'
  - kind: Grid
    spec:
      display:
        title: kimi
        collapse:
          open: true
      items:
      - x: 0
        y: 0
        width: 8
        height: 6
        content:
          $ref: '#/spec/panels/k5'
      - x: 8
        y: 0
        width: 8
        height: 6
        content:
          $ref: '#/spec/panels/k7'
  - kind: Grid
    spec:
      display:
        title: gemini
        collapse:
          open: true
      items:
      - x: 0
        y: 0
        width: 8
        height: 6
        content:
          $ref: '#/spec/panels/gdaily'
