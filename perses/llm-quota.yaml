kind: Dashboard
metadata:
  name: llm-quota-native
  project: llm
spec:
  display:
    name: LLM Quotas
  duration: 24h
  panels:
    a5:
      kind: Panel
      spec:
        display:
          name: "anthropic \xB7 5-hour"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
            sparkline:
              width: 2
            legendMode: 'off'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="anthropic",scope="all",window="five_hour"}
                seriesNameFormat: left
    a7:
      kind: Panel
      spec:
        display:
          name: "anthropic \xB7 7-day"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
            sparkline:
              width: 2
            legendMode: 'off'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="anthropic",scope="all",window="seven_day"}
                seriesNameFormat: left
    afable:
      kind: Panel
      spec:
        display:
          name: "anthropic \xB7 fable weekly"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            thresholds:
              defaultColor: '#e02f44'
              steps:
              - value: 0.1
                color: '#eda100'
              - value: 0.3
                color: '#1db954'
            sparkline:
              width: 2
            legendMode: 'off'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: 1 - llm_quota_utilization_ratio{provider="anthropic",scope="fable",window="seven_day"}
                seriesNameFormat: left
    o7:
      kind: Panel
      spec:
        display:
          name: "openai \xB7 7-day"
